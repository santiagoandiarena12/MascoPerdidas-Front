<div class="home-wrapper">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__content">
      <span class="hero__kicker">Comunidad solidaria de Tandil</span>
      <h1 id="hero-title">Encontremos a tu mascota juntos</h1>
      <p>
        Una plataforma confiable para reportar, buscar y compartir informacion sobre mascotas
        perdidas o encontradas.
      </p>
      <div class="hero__actions">
        <button type="button" class="hero__btn hero__btn--primary" (click)="scrollToMap()">
          Ver mapa de reportes
        </button>
        <a routerLink="/reportes" class="hero__btn hero__btn--secondary">Publicar reporte</a>
      </div>
    </div>
    <div class="hero__badge" aria-hidden="true">
      <img
        class="hero__logo"
        ngSrc="/Logo2.png"
        width="130"
        height="130"
        alt="MascoPerdidas logo decorativo"
      />
    </div>
  </section>

  <section class="mapa-container" id="mapa-reportes" aria-label="Mapa de reportes de mascotas">
    <h2 class="mapa-titulo">Mapa de reportes</h2>
    <div #mapaMascotas class="mapa"></div>
  </section>

  <button class="btn-filtros-flotante" (click)="toggleDrawer()" aria-label="Abrir filtros">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
    </svg>
    <span>Filtros</span>
  </button>

  <!-- Overlay -->
  @if (drawerAbierto()) {
    <div class="drawer-overlay" (click)="toggleDrawer()"></div>
  }

  <aside class="drawer" [class.drawer--abierto]="drawerAbierto()" role="dialog" aria-modal="true" aria-label="Filtros de busqueda">
    <div class="drawer-header">
      <button class="drawer-cerrar" (click)="toggleDrawer()" aria-label="Cerrar filtros">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <app-filtros (filtrosAplicados)="onFiltrosAplicados($event)" />
  </aside>
</div>
