<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <img
        class="footer__logo"
        ngSrc="/logoMasco.png"
        width="64"
        height="64"
        alt="MascoPerdidas logo"
      />
      <div>
        <div class="footer__name">MascoPerdidas</div>
        <div class="footer__tagline">Encuentra, reporta y rescata mascotas perdidas.</div>
      </div>
    </div>

    <div class="footer__nav">
      <div class="footer__section">
        <div class="footer__section-title">Explorar</div>
        <a routerLink="/" class="footer__link">Mapa</a>
        <a routerLink="/reportes" class="footer__link">Reportes</a>
        <a routerLink="/login" class="footer__link">Iniciar sesión</a>
      </div>

      <div class="footer__section">
        <div class="footer__section-title">Comunidad</div>
        <a href="#" class="footer__link" aria-label="Ver consejos de seguridad">Consejos de seguridad</a>
        <a href="#" class="footer__link" aria-label="Contactar a soporte">Soporte</a>
        <a href="#" class="footer__link" aria-label="Ver preguntas frecuentes">FAQ</a>
      </div>

      <div class="footer__section">
        <div class="footer__section-title">Legal</div>
        <a href="#" class="footer__link">Términos</a>
        <a href="#" class="footer__link">Privacidad</a>
        <a href="#" class="footer__link">Cookies</a>
      </div>
    </div>
  </div>

  <div class="footer__bottom">
    <div>© {{ year }} MascoPerdidas. Todos los derechos reservados.</div>
    <div class="footer__socials" aria-label="Redes sociales">
      <a href="#" aria-label="Visitar Facebook" class="footer__social">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
      </a>
      <a href="#" aria-label="Visitar Instagram" class="footer__social">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
      <a href="#" aria-label="Visitar Twitter" class="footer__social">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"></path></svg>
      </a>
    </div>
  </div>
</footer>
